<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pizarra WebRTC + PeerJS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <!-- PeerJS + QR + jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header data-collapsed="false">
      <button id="menuToggle" class="btn menu-toggle" type="button" aria-expanded="true" aria-controls="toolbarControls">Ocultar menú</button>
      <div class="toolbar-nav" role="tablist" aria-label="Secciones de la herramienta">
        <button class="btn tab-btn" type="button" data-target="session" role="tab" aria-controls="section-session">Sesión</button>
        <button class="btn tab-btn" type="button" data-target="draw" role="tab" aria-controls="section-draw">Dibujo</button>
        <button class="btn tab-btn" type="button" data-target="options" role="tab" aria-controls="section-options">Opciones</button>
      </div>
      <div id="toolbarControls" class="toolbar-controls" data-active="session">
        <div id="section-session" class="toolbar-section" data-section="session" role="tabpanel" aria-label="Controles de sesión">
          <strong id="roleLabel">Modo:</strong>
          <button id="hostBtn" class="btn host-only" data-state="idle">🖥️ Compartir mi pizarra</button>
          <label id="codeWrapper">Código <input id="code" type="text" placeholder="ABC123" style="width:7rem;text-transform:uppercase"/></label>
          <button id="joinBtn" class="btn" data-state="idle">👥 Unirme a una pizarra</button>
          <button id="qrBtn" class="btn host-only" title="Mostrar QR de conexión">QR</button>
        </div>
        <div id="section-draw" class="toolbar-section" data-section="draw" role="tabpanel" aria-label="Herramientas de dibujo">
          <div class="draw-toolbar edit-only" role="group" aria-label="Controles principales de dibujo">
            <div class="draw-toolbar-actions">
              <button id="toolSettingsToggle" class="btn tool-trigger" type="button" aria-expanded="false" aria-controls="toolSettingsPanel" title="Seleccionar herramienta">✏️ Trazo libre</button>
              <button id="eraser" class="btn" type="button">Borrador</button>
              <div class="draw-toolbar-divider" aria-hidden="true"></div>
              <button id="undo" class="btn host-only" type="button" title="Deshacer último trazo">↩️ Deshacer</button>
              <button id="redo" class="btn host-only" type="button" title="Rehacer">↪️ Rehacer</button>
              <button id="clear" class="btn host-only" type="button">Limpiar</button>
              <button id="insertImage" class="btn host-only" type="button" title="Insertar imagen">🖼️ Imagen</button>
              <button id="viewToggle" class="btn view-toggle" type="button" aria-pressed="false" title="Maximizar área de dibujo">⛶ Maximizar</button>
            </div>
          </div>
        </div>
        <div id="section-options" class="toolbar-section" data-section="options" role="tabpanel" aria-label="Otras opciones">
          <button id="openPdf" class="btn host-only" type="button" title="Abrir un PDF y añadir sus páginas">Abrir PDF</button>
          <button id="savePdf" class="btn host-only" title="Guardar como PDF">Guardar PDF</button>
          <label class="host-only"><input id="lockGuests" type="checkbox"/> Solo anfitrión dibuja</label>
        </div>
        <input id="pdfInput" class="host-only" type="file" accept="application/pdf" style="display:none" />
        <input id="imageInput" class="host-only" type="file" accept="image/*" style="display:none" />
      </div>
      <div class="header-pages">
        <button id="pageToggle" class="btn host-only" type="button" aria-expanded="false" aria-controls="pagePanel" title="Mostrar páginas">🗂️ Páginas</button>
      </div>
      <span id="status">sin conexión</span>
    </header>
    <div id="toolSettingsPanel" class="tool-settings-popover edit-only" aria-live="polite" data-open="false" aria-hidden="true">
      <div class="tool-settings-head">
        <div class="tool-settings-heading">
          <strong id="toolSettingsTitle">Trazo libre</strong>
          <span id="toolSettingsHint">Ajusta las propiedades de la herramienta seleccionada</span>
        </div>
        <div class="tool-settings-actions">
          <button id="toolSettingsReset" class="btn icon-btn" type="button" aria-label="Restaurar ajustes de herramientas" title="Restaurar ajustes de herramientas">↺</button>
          <button id="toolSettingsPin" class="btn icon-btn" type="button" aria-pressed="false" aria-label="Fijar panel de herramientas">📌</button>
          <button id="toolSettingsClose" class="btn icon-btn" type="button" aria-label="Cerrar ajustes">✕</button>
        </div>
      </div>
      <div class="tool-settings-tabs" role="tablist" aria-label="Herramientas disponibles">
        <button class="btn tool-btn" type="button" data-tool="pen" aria-selected="true" title="Trazo libre">✏️ Trazo</button>
        <button class="btn tool-btn" type="button" data-tool="line" aria-selected="false" title="Dibujar línea recta">➖ Línea</button>
        <button class="btn tool-btn" type="button" data-tool="rect" aria-selected="false" title="Dibujar rectángulo">⬛ Rectángulo</button>
        <button class="btn tool-btn" type="button" data-tool="ellipse" aria-selected="false" title="Dibujar círculo o elipse">⚪ Círculo</button>
        <button class="btn tool-btn" type="button" data-tool="highlight" aria-selected="false" title="Resaltador semitransparente">🟡 Resaltador</button>
        <button class="btn tool-btn" type="button" data-tool="eraser" aria-selected="false" title="Borrador">🧽 Borrador</button>
        <button class="btn tool-tab host-only" type="button" data-tab="page" aria-selected="false" title="Opciones de la página">📄 Página</button>
      </div>
      <div class="tool-settings-content">
        <div class="tool-settings-grid" data-pane="tool">
          <label class="tool-setting" data-field="stroke" for="color">
            <span id="strokeLabel">Color del trazo</span>
            <input id="color" type="color" value="#000000" />
          </label>
          <label class="tool-setting" data-field="size" for="size">
            <span id="sizeLabel">Grosor (px)</span>
            <input id="size" type="number" min="1" max="100" value="4" />
          </label>
          <label class="tool-setting" data-field="fill" id="fillSetting" for="shapeFill" hidden>
            <span id="fillLabel">Relleno</span>
            <div class="fill-input-group">
              <input id="shapeFill" type="color" value="#ffffff" />
              <label class="fill-transparent-toggle">
                <input id="shapeFillTransparent" type="checkbox" />
                <span>Sin relleno</span>
              </label>
            </div>
          </label>
          <label class="tool-setting" data-field="eraser" for="eraserSize" hidden>
            <span>Grosor borrador</span>
            <input id="eraserSize" type="number" min="1" max="100" value="20" />
          </label>
        </div>
        <div class="tool-settings-grid host-only" data-pane="page" hidden>
          <label class="tool-setting" data-field="bg" for="bg">
            <span>Fondo de la página</span>
            <input id="bg" type="color" value="#ffffff" />
          </label>
        </div>
      </div>
    </div>
    <div class="board" id="board">
      <canvas id="canvas" style="height: calc(100vh - 56px);"></canvas>
      <div id="eraserCursor" aria-hidden="true"></div>
    </div>
  </div>
  <div id="pagePanel" class="page-panel host-only" role="dialog" aria-modal="false" aria-label="Páginas de la pizarra" hidden>
    <div class="page-panel-head">
      <strong>Páginas</strong>
      <button id="pageClose" class="btn" type="button" title="Ocultar panel">Cerrar</button>
    </div>
    <div class="page-tools">
      <button id="pagePrev" class="btn" type="button" title="Página anterior">◀</button>
      <button id="pageNext" class="btn" type="button" title="Página siguiente">▶</button>
      <button id="pageAdd" class="btn" type="button" title="Añadir una página nueva">➕ Añadir</button>
    </div>
    <div id="pageThumbnails" class="page-thumbnails" role="listbox" aria-label="Miniaturas de páginas"></div>
  </div>

  <!-- QR modal -->
  <div class="qr-overlay" id="qrOverlay" role="dialog" aria-modal="true">
    <div class="qr-card">
      <div class="qr-head">
        <strong>Conéctate a esta pizarra</strong>
        <button id="qrClose" class="btn">Cerrar</button>
      </div>
      <div class="qr-box"><div id="qr"></div></div>
      <div class="qr-meta">
        <div>Abre esta URL y usa el código <span class="kbd" id="qrCodeText">—</span></div>
        <button id="copyUrlBtn" class="btn copy-btn host-only" type="button">Copiar enlace</button>
        <div id="qrUrl" class="qr-url host-only" title="Haz clic para copiar" role="button" tabindex="-1" aria-disabled="true">—</div>
        <div id="copyUrlFeedback" class="copy-feedback hidden" aria-live="polite">Enlace copiado</div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>

</body>
</html>
